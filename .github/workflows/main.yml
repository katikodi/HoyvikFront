name: Notify Discord on Push

on:
    push:
        branches:
            - "**"


            
jobs:
    notify-discord:
        runs-on: ubuntu-latest

        steps:
            - name: Send Discord notification
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  REPOSITORY: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  BRANCH: ${{ github.ref_name }}
                  AUTHOR: ${{ github.actor }}
                  RUN_ID: ${{ github.run_id }}
                  TIMESTAMP: ${{ github.event.head_commit.timestamp }}
                  COMMITS: ${{ toJson(github.event.commits) }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK" ]; then
                    echo "DISCORD_WEBHOOK secret is not configured"
                    exit 1
                  fi

                  COMMIT_COUNT=$(echo "$COMMITS" | jq 'length')

                  COMMIT_LIST=$(echo "$COMMITS" | jq -r '
                    .[]
                    | "- `\(.id[0:7])` \(.message | split("\n")[0]) — \(.author.name)"
                  ')

                  jq -n \
                    --arg title "🚀 New Push to $REPOSITORY" \
                    --arg commit_url "https://github.com/$REPOSITORY/commit/$SHA" \
                    --arg branch "$BRANCH" \
                    --arg author "$AUTHOR" \
                    --arg commit_count "$COMMIT_COUNT commits pushed" \
                    --arg commits "$COMMIT_LIST" \
                    --arg workflow_url "https://github.com/$REPOSITORY/actions/runs/$RUN_ID" \
                    --arg timestamp "$TIMESTAMP" \
                    '{
                      embeds: [{
                        title: $title,
                        url: $commit_url,
                        color: 3447003,
                        fields: [
                          {
                            name: "Branch",
                            value: $branch,
                            inline: true
                          },
                          {
                            name: "Pushed by",
                            value: $author,
                            inline: true
                          },
                          {
                            name: "Changes",
                            value: $commit_count,
                            inline: true
                          },
                          {
                            name: "Commits",
                            value: $commits,
                            inline: false
                          },
                          {
                            name: "Workflow Run",
                            value: $workflow_url,
                            inline: false
                          }
                        ],
                        timestamp: $timestamp
                      }]
                    }' |
                  curl \
                    --fail-with-body \
                    -H "Content-Type: application/json" \
                    -X POST \
                    -d @- \
                    "$DISCORD_WEBHOOK"
