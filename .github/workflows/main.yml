name: Notify Discord on Push

on:
    push:
        branches:
            - "**"

jobs:
    notify-discord:
        runs-on: ubuntu-latest

        steps:
            - name: Send Discord notification
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  REPOSITORY: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  BEFORE: ${{ github.event.before }}
                  BRANCH: ${{ github.ref_name }}
                  AUTHOR: ${{ github.actor }}
                  COMMITS: ${{ toJson(github.event.commits) }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK" ]; then
                    echo "DISCORD_WEBHOOK secret is not configured"
                    exit 1
                  fi

                  if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                    COMPARE_URL="https://github.com/$REPOSITORY/commit/$SHA"
                  else
                    COMPARE_URL="https://github.com/$REPOSITORY/compare/$BEFORE...$SHA"
                  fi

                  COMMIT_COUNT=$(echo "$COMMITS" | jq 'length')

                  RAW_COMMIT_LIST=$(echo "$COMMITS" | jq -r '
                    .[]? | "- [\(.id[0:7])](\(.url)) \(.message | split("\n")[0]) — \(.author.name)"
                  ')

                  if [ ${#RAW_COMMIT_LIST} -gt 1000 ]; then
                    COMMIT_LIST="${RAW_COMMIT_LIST:0:950}... (truncated)"
                  else
                    COMMIT_LIST="${RAW_COMMIT_LIST:-"No commit details available"}"
                  fi

                  jq -n \
                    --arg title "🚀 New Push to $REPOSITORY" \
                    --arg compare_url "$COMPARE_URL" \
                    --arg branch "$BRANCH" \
                    --arg author "$AUTHOR" \
                    --arg commit_count "$COMMIT_COUNT commits pushed" \
                    --arg commits "$COMMIT_LIST" \
                    '{
                      embeds: [{
                        title: $title,
                        url: $compare_url,
                        color: 3447003,
                        fields: [
                          { name: "Branch", value: $branch, inline: true },
                          { name: "Pushed by", value: $author, inline: true },
                          { name: "Changes", value: $commit_count, inline: true },
                          { name: "Commits", value: $commits, inline: false }
                        ]
                      }]
                    }' |
                  curl \
                    --fail-with-body \
                    -H "Content-Type: application/json" \
                    -X POST \
                    -d @- \
                    "$DISCORD_WEBHOOK"
