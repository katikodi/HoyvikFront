name: Notify Discord on Push

on:
    push:
        branches:
            - "**"

jobs:
    notify-discord:
        runs-on: ubuntu-latest

        steps:
            - name: Send Discord notification
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  REPOSITORY: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  BRANCH: ${{ github.ref_name }}
                  AUTHOR: ${{ github.actor }}
                  MESSAGE: ${{ github.event.head_commit.message }}
                  TIMESTAMP: ${{ github.event.head_commit.timestamp }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK" ]; then
                    echo "DISCORD_WEBHOOK secret is not configured"
                    exit 1
                  fi

                  SHORT_SHA="${SHA:0:7}"

                  jq -n \
                    --arg title "🚀 New Push to $REPOSITORY" \
                    --arg commit_url "https://github.com/$REPOSITORY/commit/$SHA" \
                    --arg branch "$BRANCH" \
                    --arg author "$AUTHOR" \
                    --arg commit "$SHORT_SHA" \
                    --arg message "$MESSAGE" \
                    --arg workflow_url "https://github.com/$REPOSITORY/actions/runs/$RUN_ID" \
                    --arg timestamp "$TIMESTAMP" \
                    '{
                      embeds: [{
                        title: $title,
                        url: $commit_url,
                        color: 3447003,
                        fields: [
                          {
                            name: "Branch",
                            value: $branch,
                            inline: true
                          },
                          {
                            name: "Author",
                            value: $author,
                            inline: true
                          },
                          {
                            name: "Commit",
                            value: $commit,
                            inline: false
                          },
                          {
                            name: "Message",
                            value: $message,
                            inline: false
                          },
                          {
                            name: "Workflow Run",
                            value: $workflow_url,
                            inline: false
                          }
                        ],
                        timestamp: $timestamp
                      }]
                    }' |
                  curl \
                    --fail-with-body \
                    -H "Content-Type: application/json" \
                    -X POST \
                    -d @- \
                    "$DISCORD_WEBHOOK"
