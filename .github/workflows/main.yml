name: Call Webhook on Push

on:
  push:
    branches:
      - main

jobs:
  trigger-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"Push to ${{ github.repository }}\nCommit: ${{ github.sha }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"
