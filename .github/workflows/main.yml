name: Notify Discord on Push

on:
    push:
        branches:
            - "**"

permissions:
    actions: read
    contents: read

jobs:
    notify-discord:
        runs-on: ubuntu-latest

        steps:
            - name: Send Discord notification
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  REPOSITORY: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  BEFORE: ${{ github.event.before }}
                  BRANCH: ${{ github.ref_name }}
                  AUTHOR: ${{ github.actor }}
                  COMMITS: ${{ toJson(github.event.commits) }}
                  GITHUB_TOKEN: ${{ github.token }}
                  CURRENT_RUN_ID: ${{ github.run_id }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK" ]; then
                    echo "DISCORD_WEBHOOK secret is not configured"
                    exit 1
                  fi

                  get_commit_status() {
                    local sha="$1"
                    local response
                    local running
                    local failed
                    local successful
                    local cancelled
                    local skipped
                    local total

                    for attempt in {1..30}; do
                      response=$(curl \
                        --fail-with-body \
                        -sS \
                        -H "Accept: application/vnd.github+json" \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$sha&per_page=100")

                      response=$(echo "$response" | jq \
                        --arg current_run_id "$CURRENT_RUN_ID" \
                        '[
                          .workflow_runs[]
                          | select((.id | tostring) != $current_run_id)
                        ]')

                      total=$(echo "$response" | jq 'length')

                      if [ "$total" -eq 0 ]; then
                        echo "⚪"
                        return
                      fi

                      running=$(echo "$response" | jq '
                        map(select(.status != "completed"))
                        | length
                      ')

                      if [ "$running" -gt 0 ]; then
                        sleep 10
                        continue
                      fi

                      failed=$(echo "$response" | jq '
                        map(select(
                          .conclusion == "failure"
                          or .conclusion == "timed_out"
                          or .conclusion == "startup_failure"
                        ))
                        | length
                      ')

                      cancelled=$(echo "$response" | jq '
                        map(select(.conclusion == "cancelled"))
                        | length
                      ')

                      skipped=$(echo "$response" | jq '
                        map(select(
                          .conclusion == "skipped"
                          or .conclusion == "neutral"
                        ))
                        | length
                      ')

                      successful=$(echo "$response" | jq '
                        map(select(.conclusion == "success"))
                        | length
                      ')

                      if [ "$failed" -gt 0 ]; then
                        echo "❌"
                        return
                      fi

                      if [ "$cancelled" -gt 0 ]; then
                        echo "⚠️"
                        return
                      fi

                      if [ "$successful" -gt 0 ]; then
                        echo "✅"
                        return
                      fi

                      if [ "$skipped" -eq "$total" ]; then
                        echo "⏭️"
                        return
                      fi

                      echo "⚪"
                      return
                    done

                    echo "⏳"
                  }

                  build_commit_list() {
                    echo "$COMMITS" | jq -r \
                      '.[]
                      | [
                          .id,
                          (.message | split("\n")[0]),
                          .author.name,
                          .url
                        ]
                      | @tsv'
                  }

                  COMMIT_LIST=""

                  while IFS=$'\t' read -r commit_sha commit_message commit_author commit_url; do
                    STATUS=$(get_commit_status "$commit_sha")
                    SHORT_SHA="${commit_sha:0:7}"

                    COMMIT_LIST="${COMMIT_LIST}${STATUS} [${SHORT_SHA}](${commit_url}) ${commit_message} — ${commit_author}"$'\n'
                  done < <(build_commit_list)

                  COMMIT_COUNT=$(echo "$COMMITS" | jq 'length')

                  jq -n \
                    --arg title "🚀 New Push to $REPOSITORY" \
                    --arg compare_url "https://github.com/$REPOSITORY/compare/$BEFORE...$SHA" \
                    --arg branch "$BRANCH" \
                    --arg author "$AUTHOR" \
                    --arg commit_count "$COMMIT_COUNT commits pushed" \
                    --arg commits "$COMMIT_LIST" \
                    '{
                      embeds: [{
                        title: $title,
                        url: $compare_url,
                        color: 3447003,
                        fields: [
                          {
                            name: "Branch",
                            value: $branch,
                            inline: true
                          },
                          {
                            name: "Pushed by",
                            value: $author,
                            inline: true
                          },
                          {
                            name: "Changes",
                            value: $commit_count,
                            inline: true
                          },
                          {
                            name: "Commits",
                            value: $commits,
                            inline: false
                          }
                        ]
                      }]
                    }' |
                  curl \
                    --fail-with-body \
                    -H "Content-Type: application/json" \
                    -X POST \
                    -d @- \
                    "$DISCORD_WEBHOOK"
