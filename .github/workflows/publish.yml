name: Deploy to VPS

on:
    push:
        branches:
            - publish
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: vps-deployment
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Another Test
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e

                      cd ~/HoyvikFront

                      echo "Repository:"
                      git remote -v

                      echo "Current commit:"
                      git rev-parse HEAD

                      echo "Fetching repository..."
                      git fetch origin publish

                      echo "Git access works"
