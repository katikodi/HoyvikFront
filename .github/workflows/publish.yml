name: Deploy to VPS

on:
  push:
    branches:
      - publish
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - name: Restore Fallout
        run: dotnet tool restore

      - name: Install frontend dependencies
        run: npm --prefix ./frontend ci

      - name: Publish with Fallout
        run: ./build.sh --target Publish

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        working-directory: ./backend/HoyvikProject.AppHost
        run: aspire do push

      - name: Tag backend as latest
        run: |
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/katikodi/hoyvikfront/backend:' | head -n 1)
          echo "Built image: $IMAGE"
          docker tag "$IMAGE" ghcr.io/katikodi/hoyvikfront/backend:latest
          docker push ghcr.io/katikodi/hoyvikfront/backend:latest

      - name: Copy Compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/HoyvikProject.AppHost/aspire-output/docker-compose.yaml"
          target: "/opt/hoyvik"
          strip_components: 3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/hoyvik

            echo "Pulling latest images..."
            docker compose -f docker-compose.yaml pull

            echo "Starting containers..."
            docker compose -f docker-compose.yaml up -d

            echo "Waiting for backend to start..."
            sleep 10

            echo "Container status:"
            docker compose -f docker-compose.yaml ps

            if [ "$(docker inspect -f '{{.State.Running}}' hoyvik-backend-1)" != "true" ]; then
              echo "Backend failed to start."
              docker compose -f docker-compose.yaml logs backend --tail=100
              exit 1
            fi

            echo "Backend is running."
