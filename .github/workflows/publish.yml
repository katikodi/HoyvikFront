name: Deploy to VPS

on:
  push:
    branches:
      - publish
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - name: Restore Fallout
        run: dotnet tool restore

      - name: Install frontend dependencies
        run: npm --prefix ./frontend ci

      - name: Publish with Fallout
        run: ./build.sh --target Publish

      - name: Show generated Compose
        run: cat ./backend/HoyvikProject.AppHost/aspire-output/docker-compose.yaml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ~/HoyvikFront
            git fetch origin publish
            git reset --hard origin/publish

            npm ci
            npm --prefix ./frontend ci
            npm run deploy-on-vps
