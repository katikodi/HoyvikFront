name: Deploy to VPS

on:
    push:
        branches:
            - publish
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: vps-deployment
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: TEST TEST TEST
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e

                      cd ~/HoyvikFront

                      echo "Repository structure:"
                      ls -la

                      echo "Backend structure:"
                      ls -la backend

                      echo "Node version:"
                      node --version

                      echo "npm version:"
                      npm --version
