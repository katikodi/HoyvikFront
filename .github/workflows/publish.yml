name: Deploy to VPS

on:
  push:
    branches:
      - publish
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - name: Restore Fallout
        run: dotnet tool restore

      - name: Install frontend dependencies
        run: npm --prefix ./frontend ci

      - name: Publish with Fallout
        run: ./build.sh --target Publish

      - name: Show generated Compose
        run: cat ./backend/HoyvikProject.AppHost/aspire-output/docker-compose.yaml

      - name: Show backend image
        run: grep '^BACKEND_IMAGE=' ./backend/HoyvikProject.AppHost/aspire-output/.env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        working-directory: ./backend/HoyvikProject.AppHost
        run: aspire do push

      - name: Tag backend as latest
        run: |
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/katikodi/hoyvikfront/backend:' | head -n 1)
          echo "Built image: $IMAGE"
          docker tag "$IMAGE" ghcr.io/katikodi/hoyvikfront/backend:latest
          docker push ghcr.io/katikodi/hoyvikfront/backend:latest
